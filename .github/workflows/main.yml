name: 24/7 YouTube Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download Video File
      run: |
        wget --no-check-certificate -O video.mp4 "https://google.com"

    - name: Start Live Stream
      run: |
        ffmpeg -re -stream_loop -1 -i video.mp4 -vcodec libx264 -pix_fmt yuv420p -maxrate 2048k -bufsize 2048k -acodec aac -b:a 128k -f flv "rtmp://://youtube.com{{ secrets.YOUTUBE_STREAM_KEY }}"
